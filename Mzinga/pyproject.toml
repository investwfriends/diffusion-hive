[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mzinga"
version = "0.1.0"
description = "Python port of Mzinga Hive game engine"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mzinga-perft = "mzinga_perft.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
gym = [
    "gymnasium>=1.0",
    "torch>=2.12.0",
]
mypyc = [
    "mypy>=1.10",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "mypy>=1.10",
]
